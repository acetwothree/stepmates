name: StepMates
options:
  bundleIdPrefix: com.acetwothree
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_PREVIEWS: YES
    MARKETING_VERSION: "1.0"
    # Overridden at archive time in CI (CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER) so every
    # TestFlight upload gets a unique, monotonically increasing build number automatically.
    CURRENT_PROJECT_VERSION: "1"

targets:
  StepMates:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StepMates
    info:
      path: StepMates/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        NSHealthShareUsageDescription: "StepMates uses your step count to track daily progress and display shared stats with your partner."
        NSHealthUpdateUsageDescription: "StepMates syncs step goals and active walk streaks to Apple Health."
        # StepMates only uses standard OS-provided HTTPS/TLS (via CloudKit, URLSession, etc.)
        # — no custom or non-exempt encryption — so this is a truthful "no" that makes every
        # future TestFlight build skip App Store Connect's manual export-compliance gate
        # ("Missing Compliance") instead of sitting unusable until someone clicks through it.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: StepMates/Resources/StepMates.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.acetwothree.stepmates
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acetwothree.stepmates
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"StepMates/Preview Content\""
        TARGETED_DEVICE_FAMILY: "1"

  StepMatesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StepMatesTests
    dependencies:
      - target: StepMates

  StepMatesUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StepMatesUITests
    dependencies:
      - target: StepMates

schemes:
  StepMates:
    build:
      targets:
        StepMates: all
        StepMatesTests: [test]
        StepMatesUITests: [test]
    test:
      targets:
        - StepMatesTests
        - StepMatesUITests
    run:
      config: Debug
